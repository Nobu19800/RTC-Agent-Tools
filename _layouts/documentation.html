  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>

</head>
<body>
  <nav aria-label="RTC-Agent-Tools">
    <a href="{{ '/' | relative_url }}">RTC-Agent-Tools</a>
    <a href="{{ '/README.ja.html' | relative_url }}" lang="ja">日本語</a>
